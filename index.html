<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>どら山 当日の時間割</title>
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#1d5b37;--g2:#174a2c;--cream:#f4f3ec;--coral:#d8552c;--ink:#1c2a22;--mut:#66736b;--line:#d9d7ca}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--g) url(img/bg-pattern-v2.svg);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh}
.top,.warn{background:var(--g)}
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px;color:var(--cream)}
.top>img{height:26px;margin-right:4px}
.top input[type=date]{height:38px;border:0;border-radius:9px;padding:0 8px;background:#fff;color:var(--ink);font-weight:700}
.top .ib{width:38px;height:38px;color:var(--ink);border:0}
.code input{width:130px;height:34px;border:0;border-radius:8px;padding:0 8px;color:var(--ink)}
.code button,.air{height:36px;border:0;border-radius:9px;padding:0 12px;background:var(--cream);color:var(--ink);font-weight:700;cursor:pointer}
.air{background:#ffe19c}
.brand{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.brand img{height:30px}.brand b{font-size:16px;font-weight:700}
.card{background:var(--cream);color:var(--ink);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.card h2{font-size:12.5px;margin:0 0 8px;color:var(--g);font-weight:700;letter-spacing:.04em}
.datebar{display:flex;gap:6px;align-items:center}
.datebar input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;font-weight:700}
.ib{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;display:grid;place-items:center}
.ib svg,.sv{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status{font-size:12.5px;color:#d9e7dc;flex:1;min-width:140px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.nums label{font-size:11px;color:var(--mut);display:block}
.nums input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;text-align:center;font-weight:700;background:#fff;margin-top:2px}
.staff{display:grid;grid-template-columns:24px 1fr 62px 62px 26px;gap:4px;align-items:center;margin-bottom:4px}
.staff input,.staff select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 3px;min-width:0;font-size:13px}
.staff input{padding:0 6px}
.star,.del{border:0;background:none;cursor:pointer;padding:0;height:36px;display:grid;place-items:center;color:#b5b3a3}
.star.on{color:var(--coral)}.star.on svg{fill:currentColor}
.roles{grid-column:2/-1;display:flex;gap:3px;margin:-1px 0 7px}
.roles button{flex:1;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;cursor:pointer}
.roles button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.add{width:100%;height:38px;border:1px dashed #a9a794;background:none;border-radius:9px;cursor:pointer;color:var(--g);font-weight:500}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;font-size:13.5px;resize:vertical}
.warn{font-size:12.5px;line-height:1.45;margin:0;padding:0 12px 8px;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.warn li{padding:3px 9px;border-radius:7px;background:#e8efe6}
.warn li.bad{background:#fbe2d8;color:#8d2d10;font-weight:500}
.warn li.ok{background:#e4efe3;color:#1d5b37}
.print{height:40px;padding:0 20px;border:0;border-radius:11px;background:var(--coral);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.sub{height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.5);background:none;color:var(--cream);border-radius:10px;cursor:pointer}
.hint{font-size:11.5px;line-height:1.5;color:#cfe0d4;margin:8px 2px 0}
.work{flex:1;min-height:0;display:flex;background:var(--g)}
.stage{flex:1;min-width:0;overflow:auto;padding:0 10px 14px 14px}
@media (max-width:760px),(max-height:500px){.palette{display:none}.app{height:auto}.work{display:block}.stage{padding:0 8px 16px}.print{height:38px}}
.palette{width:178px;flex:none;background:#fff;overflow:auto;padding:12px 11px;color:#222}
.palette h3{margin:0 0 10px;font-size:15px;font-weight:700}
.palette p{font-size:11px;color:#777;margin:8px 0 0}
.pw{color:#fff;font-size:14px;font-weight:700;padding:8px 10px;border-radius:5px;margin-bottom:8px;border-bottom:3px solid rgba(0,0,0,.28);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pw.k-kyu{color:#555;border:1.5px dashed #999}
.pw.ghost{position:fixed;z-index:60;pointer-events:none;width:158px;box-shadow:0 8px 20px rgba(0,0,0,.3);margin:0}
.fit{transform-origin:0 0;width:420mm;height:297mm}
/* ---- A3の紙 ---- */
.sheet{width:420mm;height:297mm;background:#fff;color:#111;padding:8mm 9mm;display:flex;flex-direction:column;gap:3mm;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.hd{display:flex;align-items:stretch;gap:5mm;border-bottom:1.2mm solid #1d5b37;padding-bottom:2mm}
.hd .d{font-size:40pt;font-weight:900;line-height:1;white-space:nowrap}
.hd .d small{font-size:19pt;font-weight:700;margin-left:2mm}
.hd .ttl{font-size:11pt;color:#444;font-weight:500;margin-bottom:1.2mm}
.hnote{flex:1;min-width:0;border-left:1mm solid #d8552c;padding:0 0 0 3mm;font-size:14pt;font-weight:700;line-height:1.25;overflow:hidden;align-self:center;max-height:23mm}.hnote span{display:block;font-size:9.5pt;font-weight:500;color:#555}
.big{display:flex;flex:none;gap:2.5mm;margin-left:auto}
.big div{border:.5mm solid #1d5b37;border-radius:2mm;padding:1mm 4mm;text-align:center;min-width:29mm}
.big span{display:block;font-size:9.5pt;color:#333;font-weight:500}
.big b{font-size:24pt;font-weight:900;line-height:1.05}
.big b i{font-size:11pt;font-style:normal;font-weight:700;margin-left:.5mm}
.big .lead{min-width:48mm}.big .lead b{font-size:17pt;line-height:1.5}
.gantt{flex:1;min-height:0;display:flex;flex-direction:column;border:.3mm solid #aaa;--nw:43mm}
.grow{display:flex;position:relative}
.gname{width:var(--nw);flex:none;border-right:.3mm solid #aaa;padding:.5mm 2mm;display:flex;flex-direction:column;justify-content:center;background:#fff;z-index:2}
.gname b{font-size:17pt;font-weight:900;line-height:1.1;display:flex;align-items:center;gap:1mm;min-height:7mm}
.gname b .blank{display:block;width:100%;border-bottom:.3mm solid #999;height:6.5mm}
.gname em{font-style:normal;font-size:10pt;color:#333;white-space:nowrap}
.gname .lk{background:#d8552c;color:#fff;font-size:8.5pt;font-weight:700;padding:.2mm 1.2mm;border-radius:.8mm;margin-left:1mm;white-space:nowrap}
.gtrack{flex:1;position:relative;overflow:hidden}
.grid{position:absolute;top:0;bottom:0;border-left:.12mm solid rgba(0,0,0,.08)}
.grid.h{border-left:.25mm solid rgba(0,0,0,.3)}.grid.m{border-left:.15mm solid rgba(0,0,0,.16)}
.ghead{height:9mm;border-bottom:.3mm solid #aaa;background:#eeeeee}
.ghead .gname{font-size:10pt;font-weight:700;background:#eeeeee}
.tick{position:absolute;top:.7mm;font-size:17pt;font-weight:900;transform:translateX(-50%);line-height:1}
.tick:first-of-type{transform:none}
.gpace{height:17mm;border-bottom:.3mm solid #aaa;background:#fafafa}
.gpace .gname{background:#fafafa}
.gpace .gname b{font-size:11.5pt}.gpace .gname em{font-size:9pt}
.pc{position:absolute;top:1mm;width:15.5mm;margin-left:-7.75mm;text-align:center}
.pc b{display:block;font-size:12pt;font-weight:900;line-height:1.1;white-space:nowrap}
.pc i{display:block;font-style:normal;height:8.2mm;border:.3mm solid #666;background:#fff;margin-top:.7mm;border-radius:.6mm}
.grows{flex:1;display:flex;flex-direction:column;min-height:0}
.grows .grow{flex:1;min-height:0;border-bottom:.3mm solid #bbb}
.grows .grow:last-child{border-bottom:0}
.bar{position:absolute;top:9%;bottom:9%;box-sizing:border-box;padding:.3mm 1mm;overflow:hidden;display:flex;flex-direction:column;justify-content:center;line-height:1.08;touch-action:manipulation;-webkit-touch-callout:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bar.lift{outline:1mm solid #d8552c;z-index:5;box-shadow:0 2mm 5mm rgba(0,0,0,.35)}
.bar b{font-size:15pt;font-weight:900;white-space:nowrap}
.bar small{font-size:11pt;font-weight:700;white-space:nowrap}
.bar.s b{font-size:10.5pt;white-space:normal;line-height:1.05}.bar.s small{font-size:8pt}
.bar.xs{padding:0;align-items:center;border-bottom-width:.6mm}.bar.xs b{font-size:9pt;writing-mode:vertical-rl;letter-spacing:-.05em}.bar.xs small{display:none}
.bar .rz{position:absolute;right:0;top:0;bottom:0;width:6mm;cursor:ew-resize}
.bar.sel{outline:1mm solid #d8552c}
.bar{color:#fff;border:0;border-bottom:1mm solid rgba(0,0,0,.28);border-radius:1.2mm}
.k-kiji{background:#f7983e}.k-yaki{background:#e8665a}.k-mise{background:#5cab13}.k-sai{background:#2a9fd6}.k-reji{background:#b474b8}.k-shik{background:#c99a5b}.k-zai{background:#17a398}.k-kata{background:#7f8c95}.k-jun{background:#a98f6f}.k-open{background:#fb6fa8}.k-free{background:#fb6fa8}
.k-kyu{background:#fff;color:#555;border:.35mm dashed #999;border-radius:1.2mm}
.shiftbg{position:absolute;top:0;bottom:0;background:#d6eef8}
.dropbar{position:absolute;top:9%;bottom:9%;border:.5mm dashed #e8488a;background:rgba(251,111,168,.25);border-radius:1.2mm;pointer-events:none}
.bt{height:69mm;flex:none;display:grid;grid-template-columns:82mm 176mm 1fr;gap:3mm}
.box{border:.4mm solid #333;border-radius:1mm;padding:1.6mm 2.4mm;overflow:hidden;display:flex;flex-direction:column}
.box h3{margin:0 0 1mm;font-size:12.5pt;font-weight:900;color:#1d5b37;border-bottom:.3mm solid #1d5b37;padding-bottom:.5mm}
table{border-collapse:collapse;width:100%}
.pt th,.pt td{font-size:12.5pt;text-align:right;padding:.35mm 1.3mm;border-bottom:.2mm solid #bbb;font-weight:700}
.pt th{font-size:9.5pt;font-weight:500;white-space:nowrap}.pt th:first-child,.pt td:first-child{text-align:left;font-weight:700;white-space:nowrap}
.pt tr.sum td{font-weight:900;border-top:.4mm solid #333;border-bottom:0;font-size:14pt}
.ck td{font-size:11.5pt;padding:1mm 1mm;border-bottom:.2mm solid #bbb;font-weight:500;vertical-align:middle;line-height:1.15}
.ck td.t{font-size:14pt;font-weight:900;width:15mm;white-space:nowrap}
.ck td.c{width:6mm}.ck td.c i{display:block;width:4.6mm;height:4.6mm;border:.35mm solid #222}
.ck td.w{width:17mm}.ck td.w u{display:block;height:9mm;border:.3mm solid #666;border-radius:.6mm}
.ck tr:last-child td{border-bottom:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3mm;flex:1;min-height:0}
.rule{margin:0;padding:0;list-style:none;font-size:11.2pt;line-height:1.3;font-weight:500}
.rule li{padding:.3mm 0 .3mm 3.2mm;text-indent:-3.2mm}.rule li::before{content:"・"}
.rule b{font-weight:900;color:#b23d15}
.bags{font-size:10.8pt;line-height:1.35;font-weight:500}
.bags b.r{font-size:16pt;font-weight:900}
.memo{flex:1;font-size:11.5pt;font-weight:700;white-space:pre-wrap;line-height:1.3}
.ft{display:none}
/* 表の上で直接直す */
.ed{cursor:pointer;border-radius:.8mm}
.ed:hover{background:rgba(216,85,44,.14)}
.inl{font:inherit;width:100%;border:.5mm solid #d8552c;border-radius:.8mm;padding:0 1mm;background:#fff;color:#111}
.gname{position:relative}
.rl{display:inline-block;border:.3mm solid #1d5b37;color:#1d5b37;font-size:9pt;font-weight:700;border-radius:.8mm;padding:0 1.2mm;margin-left:1.2mm;cursor:pointer}
.np{font:inherit;cursor:pointer}
.rmv{position:absolute;right:.6mm;bottom:.5mm;width:5mm;height:5mm;border:0;background:none;color:#999;font-size:11pt;line-height:1;padding:0;opacity:0}
.grow:hover .rmv{opacity:1}
.addp{border:.3mm solid #1d5b37;background:#fff;color:#1d5b37;border-radius:.8mm;font-size:9pt;font-weight:700;padding:.2mm 1.5mm;margin-left:1.5mm}
.mklead{position:absolute;right:.6mm;top:.5mm;border:.3mm dashed #999;background:none;color:#777;border-radius:.8mm;font-size:8pt;padding:0 1mm;opacity:0}
.gname .lk{position:absolute;right:.6mm;top:.5mm;margin:0}
.ghead .gname{flex-direction:row;align-items:center;white-space:nowrap}
.grow:hover .mklead{opacity:1}
.hnote.empty{color:#999;font-weight:500;font-size:11pt;border-left-color:#ccc}
.gtrack[data-p]{cursor:copy}
/* 編集窓 */
.pop{position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);width:min(460px,94vw);background:var(--cream);border-radius:16px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);display:none}
.pop.on{display:block}
.pop h4{margin:0 0 8px;font-size:14px;color:var(--g)}
.pop .r{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.pop input,.pop select{height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px;min-width:0;flex:1}
.pop button{height:40px;border:0;border-radius:9px;padding:0 14px;cursor:pointer;background:#fff;border:1px solid var(--line)}
.pop .go{background:var(--g);color:#fff;border-color:var(--g);font-weight:700;flex:1}
.pop .x{color:#a42b0d}
@media print{
  @page{size:A3 landscape;margin:0}
  html,body{background:#fff!important;height:auto}
  .top,.warn,.pop,.np,.palette{display:none!important}
  .work{display:block;background:#fff}
  .app{display:block;height:auto}
  .stage{padding:0;overflow:visible;background:#fff}
  .fit{transform:none!important;height:auto}
  .sheet{box-shadow:none;page-break-after:avoid;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar.sel{outline:0}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="img/header-logo.png" alt="">
    <button class="ib" id="prev" aria-label="前の日"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <input type="date" id="date">
    <button class="ib" id="next" aria-label="次の日"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

    <button class="sub" id="undo" disabled>元に戻す</button>
    <button class="sub" id="reset">組み直す</button>
    <button class="print" id="print">A3で印刷</button>
  </header>
  <ul class="warn" id="warn"></ul>
  <div class="work">
    <main class="stage" id="stage"><div class="fit" id="fit"><div class="sheet" id="sheet"></div></div></main>
    <aside class="palette" id="palette"><h3>ワーク</h3><div id="pal"></div><p>表へドラッグして追加。<br>指のときは、帯を長押ししてから動かします。</p></aside>
  </div>
</div>
<div class="pop" id="pop"></div>

<script>
var SHEET_ID="1PRDhGP_4xiO_ZjJP3NB9Id3PmaPa5W7hNyrqFQ5EyqM";
var T0=7*60,T1=16*60+30;
var ROLES=[["kiji","生地"],["yaki","焼き"],["make","作成"],["reji","レジ"]];
// 所要の初期値（推定）。実際の終了時刻の記入をもとに直していく
var CONF={open:600,stopKiji:690,pace:15,rate:80,hourlyRef:23,yakiLag:20,kataKiji:15,kataYaki:20,zaiko:910,kata:930,close:950};
var KIND={
 kiji:{t:"生地",c:"k-kiji"},yaki:{t:"焼き",c:"k-yaki"},yjun:{t:"焼台準備",c:"k-jun"},kkat:{t:"生地片付け",c:"k-kata"},ykat:{t:"焼台清掃",c:"k-kata"},
 jun:{t:"作成の準備",c:"k-jun"},mise:{t:"店売り作成",c:"k-mise"},hoju:{t:"補充",c:"k-jun"},open:{t:"開店準備",c:"k-open"},reji:{t:"レジ・接客",c:"k-reji"},cov:{t:"レジ交代",c:"k-reji"},
 sai:{t:"催事作成",c:"k-sai"},shik:{t:"翌日の仕込み",c:"k-shik"},zai:{t:"在庫",c:"k-zai"},kata:{t:"片付け",c:"k-kata"},clos:{t:"閉店",c:"k-open"},kyu:{t:"休憩",c:"k-kyu"},free:{t:"作業",c:"k-free"}
};
var WD=["日","月","火","水","木","金","土"];
var S={};
var store=load();
var cache={};
var cur={rot:0,kaiten:0,storeN:0,eventN:0,tomorrow:null,blocks:[],ok:false};
var sel=null,undoSt=[],lastState=null,lastDate=null;

function load(){try{var o=JSON.parse(localStorage.getItem("dsch1"))||{};}catch(e){var o={}}o.plans=o.plans||{};o.wd=o.wd||{};o.roster=o.roster||[];o.roleOf=o.roleOf||{};o.role2Of=o.role2Of||{};delete o.code;
  if(o.v===2){Object.keys(o.plans).forEach(function(k){o.plans[k].airSig=null});o.v=3;try{localStorage.setItem("dsch1",JSON.stringify(o))}catch(e){}}
  if(o.v!==2&&o.v!==3){Object.keys(o.plans).forEach(function(k){o.plans[k].bars=null});o.v=3;try{localStorage.setItem("dsch1",JSON.stringify(o))}catch(e){}}
  return o}
function save(){try{localStorage.setItem("dsch1",JSON.stringify(store))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function hm(m){return Math.floor(m/60)+":"+pad(m%60)}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addD(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}

/* ---- 製造表を読む（閲覧リンク経由） ---- */
function tabCands(ds){var d=parseD(ds),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);var m=d.getMonth()+1,x=d.getDate();return{mon:ymd(d),col:w+1,names:[pad(m)+pad(x),m+""+pad(x),pad(m)+""+x]}}
var jn=0;
function gviz(tab){return new Promise(function(res,rej){
  var fn="__g"+(++jn),sc=document.createElement("script"),tm=setTimeout(function(){done();rej(new Error("timeout"))},15000);
  function done(){clearTimeout(tm);try{delete window[fn]}catch(e){}sc.remove()}
  window[fn]=function(r){done();r&&r.status!=="error"?res(r):rej(new Error("tab"))};
  sc.onerror=function(){done();rej(new Error("net"))};
  sc.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:"+fn+"&headers=0&range=A1:I48&sheet="+encodeURIComponent(tab);
  document.head.appendChild(sc)})}
function loadWeek(ds){var t=tabCands(ds);
  if(cache[t.mon])return Promise.resolve(cache[t.mon]);
  function tryN(i){if(i>=t.names.length)return Promise.reject(new Error("notab"));
    return gviz(t.names[i]).then(function(r){
      var rows=r.table.rows.map(function(x){return x.c.map(function(c){return c?(c.f!=null?c.f:(c.v==null?"":c.v)):""})});
      if(!rows.length||!String(rows[0][0]).indexOf||String(rows.map(function(x){return x[0]}).join()).indexOf("回転数")<0)throw new Error("empty");
      return rows}).catch(function(){return tryN(i+1)})}
  return tryN(0).then(function(rows){cache[t.mon]=rows;return rows})}
function num(v){var n=parseFloat(String(v).replace(/[,¥\s]/g,""));return isNaN(n)?0:n}
function parseDay(rows,col){
  var blocks=[],cb=null,rot=0,ceil=0,total=0;
  rows.forEach(function(r){
    var a=String(r[0]||"").trim(),i8=String(r[8]||"");
    if(i8.indexOf("２枚")>=0||i8.indexOf("2枚")>=0&&!/はい|いいえ/.test(i8)){cb={name:a,items:[]};blocks.push(cb);return}

  });

function toMin(s){var a=String(s).split(":");return +a[0]*60+ +a[1]}

  ppl.sort(function(a,b){return a.s-b.s||b.e-a.e});

function mergeAir(p,sig){var old=p.staff,used=[],ppl=fromAir(),oldLead=false;
  ppl.forEach(function(x){var o=old.filter(function(y){return y.name===x.name&&used.indexOf(y)<0})[0];if(!o)return;used.push(o);x.role=o.role;x.role2=o.role2||"";if(o.lead)oldLead=x});

function defaults(){return[
 {name:"",s:420,e:960,role:"kiji",lead:true},

function rotVal(p){return p.ov&&p.ov.rot!=null&&p.ov.rot!==""?num(p.ov.rot):cur.rot}
function stVal(p){return p.ov&&p.ov.store!=null&&p.ov.store!==""?num(p.ov.store):cur.storeN}

/* ---- 自動で組む（5分刻みで各人の作業を決める） ---- */
function compute(p){
  var c=CONF,st=p.staff,rot=Math.ceil(rotVal(p)),A={};
  var ks=st.filter(function(x){return hasR(x,"kiji")}),ys=st.filter(function(x){return hasR(x,"yaki")});
  var msPeople=st.filter(function(x){return hasR(x,"make")||hasR(x,"reji")});
  var gS=ks.length?Math.min.apply(null,ks.map(function(x){return x.s})):c.pace+T0;
  var pace=rot?Math.min(c.pace,(c.stopKiji-gS)/rot):c.pace;
  var gE=Math.min(c.stopKiji,Math.round((gS+rot*pace)/5)*5);
  var yS=gS+c.yakiLag,yE=gE+c.yakiLag;
  var mEnd=c.open-15;
  // 店売り作成の開始を逆算：人が順に来るので後ろから積む
  var need=stVal(p)/c.rate*60,mS=mEnd,acc=0;
  while(acc<need&&mS>T0){mS-=5;acc+=5*msPeople.filter(function(x){return x.s<=mS&&x.e>mS}).length;if(!msPeople.some(function(x){return x.s<=mS}))break}
  A={rot:rot,pace:pace,gS:gS,gE:gE,yS:yS,yE:yE,mS:mS,mEnd:mEnd,mShort:acc<need,eE:Infinity};
  // 休憩：6時間超は45分、8時間超は60分。レジは13時台
  var cand=st.map(function(x,i){return{i:i,x:x}}).filter(function(o){return o.x.e-o.x.s>360});
  var base=Math.max(yE+c.kataYaki,gE+c.kataKiji,705);base=Math.ceil(base/15)*15;
  var conc=Math.max(1,Math.ceil(cand.length/3)),brk={},slot=0;
  cand.forEach(function(o){var len=o.x.e-o.x.s>480?60:45;
    if(hasR(o.x,"reji")){brk[o.i]={s:780,e:780+len,reji:true};return}
    var s=base+Math.floor(slot/conc)*60;slot++;brk[o.i]={s:s,e:s+len}});
  // レジ休憩の交代：責任者を優先
  A.brk=brk;A.cover={};
  Object.keys(brk).forEach(function(k){if(!brk[k].reji)return;
    var b=brk[k],idx=st.map(function(x,i){return i}).filter(function(i){var y=st[i];return i!=k&&!hasR(y,"reji")&&y.s<=b.s&&y.e>=b.e&&!(brk[i]&&brk[i].s<b.e&&brk[i].e>b.s)});
    idx.sort(function(a,z){return(st[z].lead?1:0)-(st[a].lead?1:0)});
    if(idx.length)A.cover[idx[0]]=b;else A.noCover=true});
  // 催事作成の終わりを、手の空く人数で積み上げて求める
  var e=evVal(p)/c.rate*60,got=0,t=mEnd;
  while(got<e&&t<c.zaiko+60){st.forEach(function(x,i){if(x.s<=t&&x.e>t&&kindAt(x,i,t,A)==="sai")got+=5});t+=5}
  A.eE=e?t:mEnd;A.eShort=got<e;
  return A}
function kindAt(x,i,t,A){
  var c=CONF,b=A.brk[i];
  if(b&&t>=b.s&&t<b.e)return"kyu";
  var cv=A.cover[i];if(cv&&t>=cv.s&&t<cv.e)return"cov";
  var k1=kindOf(x.role,t,A);if(!x.role2||x.role2===x.role)return k1;
  var k2=kindOf(x.role2,t,A);if(k1===k2)return k1;
  var g1=GENERIC.indexOf(k1)>=0,g2=GENERIC.indexOf(k2)>=0;
  return g1&&!g2?k2:g2&&!g1?k1:g1?k1:k1+"+"+k2}
var GENERIC=["jun","yjun","sai","shik","zai","kata"];
function kindInfo(k){if(KIND[k])return KIND[k];if(k&&k.indexOf("+")>0){var a=k.split("+");return{t:a.map(function(y){return(KIND[y]||KIND.free).t}).join("・"),c:(KIND[a[0]]||KIND.free).c}}return KIND.free}
function kindOf(role,t,A){var c=CONF;
  if(role==="reji"){
    if(t>=c.close)return"clos";
    if(t>=c.open)return"reji";
    if(t>=c.open-15)return"open";
    if(t>=A.mS)return"mise";
    return"jun"}
  if(role==="kiji"){if(t<A.gE)return"kiji";if(t<A.gE+c.kataKiji)return"kkat"}
  if(role==="yaki"){if(t<A.yS)return"yjun";if(t<A.yE)return"yaki";if(t<A.yE+c.kataYaki)return"ykat"}
  if(role==="make"){if(t<A.mS)return"jun";if(t<A.mEnd)return"mise"}
  if(t<A.eE)return"sai";
  if(t<c.zaiko)return"shik";
  if(t<c.kata)return"zai";
  return"kata"}
function buildBars(p,A){var out=[];
  p.staff.forEach(function(x,i){var t=x.s,k=null,s=t;
    for(;t<=x.e;t+=5){var n=t<x.e?kindAt(x,i,t,A):null;
      if(n!==k){if(k)out.push({p:i,s:s,e:t,k:k});k=n;s=t}}});
  // 休憩の前後に残る20分以下の細切れは、隣の作業に吸収する
  for(var j=out.length-1;j>=0;j--){var b=out[j];
    if(!((b.k==="shik"||b.k==="sai")&&b.e-b.s<=20)&&!(b.k==="jun"&&b.e-b.s<=15))continue;
    var pv=out[j-1],nx=out[j+1];pv=pv&&pv.p===b.p?pv:null;nx=nx&&nx.p===b.p?nx:null;
    if(nx&&nx.k!=="kyu"){nx.s=b.s;out.splice(j,1)}else if(pv&&pv.k!=="kyu"){pv.e=b.e;out.splice(j,1)}}
  return out}

function prodBox(p){

function warn(p,A){

  if(!st.some(function(x){return x.lead}))bad("責任者を星印で選んでください");
  if(!A.rot)bad("回転数が0です");
  if(A.pace<c.pace)bad("1回転"+Math.round(A.pace*10)/10+"分のペースが必要です。"+hm(c.stopKiji)+"に間に合わせるのが厳しい日です（生地の人を増やす／作成数を調整）");
  if(A.mShort)bad("店売り作成が開店に間に合いません（作成・レジの朝の人を増やす）");
  if(A.eShort||A.eE>c.zaiko)bad("催事作成が"+hm(c.zaiko)+"までに終わりません（人を足すか帯を調整）");
  var work=st.reduce(function(s,x,i){var b=A.brk[i];return s+(x.e-x.s-(b?b.e-b.s:0))},0)/60,need=(stVal(p)+evVal(p))/c.hourlyRef;
  if(need){var msg="組んだ"+Math.round(work*10)/10+"人時／必要の目安"+Math.round(need*10)/10+"人時（実績23個/人時）。";
    if(work>need*1.2)L.push('<li>'+esc(msg+"余裕があるので早上がりの候補があります")+'</li>');
    else if(work<need*.9)bad(msg+"人手が足りない見込みです");
    else ok(msg+"ちょうど良い配置です")}
  if(p.bars)L.push('<li>帯を手で直した状態です</li>');
  $("warn").innerHTML=L.join('');
}

/* ---- 表の上で直す ---- */
var ROLE_N={kiji:"生地",yaki:"焼き",make:"作成",reji:"レジ"},ROLE_O=["kiji","yaki","make","reji"];
function renderStaff(){}
function inlineEdit(el,val,cb,opts){opts=opts||{};
  var h=el.offsetHeight,inp=document.createElement("input");inp.className="inl";inp.value=val==null?"":val;if(opts.list)inp.setAttribute("list",opts.list);
  el.innerHTML="";el.appendChild(inp);inp.focus();inp.select();var done=false;
  function ok(c){if(done)return;done=true;c?render():cb(inp.value.trim())}
  inp.onkeydown=function(e){if(e.key==="Enter")ok();if(e.key==="Escape")ok(true)};
  inp.onblur=function(){ok()};inp.onpointerdown=function(e){e.stopPropagation()};inp.onclick=function(e){e.stopPropagation()}}
function bindSheet(){var p=plan(),sh=$("sheet");
  sh.querySelectorAll("[data-ov]").forEach(function(el){el.onclick=function(){var k=el.dataset.ov,b=el.querySelector("b");
    inlineEdit(b,k==="rot"?(p.ov&&p.ov.rot||cur.kaiten):k==="store"?stVal(p):evVal(p),function(v){p.ov=p.ov||{};p.ov[k]=v;p.bars=null;save();render()})}});
  var ne=$("noteEd");if(ne)ne.onclick=function(){inlineEdit(ne,p.note,function(v){p.note=v;save();render()})};
  var ap=$("addP");if(ap)ap.onclick=function(){p.staff.push({name:"",s:540,e:960,role:"make",manual:true});p.edited=true;changed(true)};
  sh.querySelectorAll(".gname[data-i]").forEach(function(g){var i=+g.dataset.i,x=p.staff[i];
    g.querySelectorAll("[data-a]").forEach(function(el){el.onclick=function(ev){ev.stopPropagation();var a=el.dataset.a;
      if(a==="name"){inlineEdit(el,x.name,function(v){x.name=v;p.edited=true;if(v&&store.roster.indexOf(v)<0)store.roster.push(v);changed(false)},{list:"roster"})}
      if(a==="role")rolePop(x,p)
      if(a==="lead"){var on=!x.lead;p.staff.forEach(function(y){y.lead=false});x.lead=on;if(on&&x.name)store.lastLead=x.name;p.edited=true;changed(false)}
      if(a==="del"){p.staff.splice(i,1);p.edited=true;changed(true)}
      if(a==="time")timePop(x,p)}})})}
function rolePop(x,p){var P=$("pop"),sel2=[x.role].concat(x.role2?[x.role2]:[]);
  function draw(){P.innerHTML='<h4>'+esc(x.name||"この人")+'の持ち場</h4><p style="margin:0 0 8px;font-size:13px">2つまで選べます（一人二役）</p><div class="r">'+ROLE_O.map(function(r){return'<button data-r="'+r+'"'+(sel2.indexOf(r)>=0?' class="go"':'')+'>'+ROLE_N[r]+'</button>'}).join('')+'</div><div class="r"><button id="rC">やめる</button><button class="go" id="rO">決定</button></div>';
    P.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){var r=b.dataset.r,i=sel2.indexOf(r);if(i>=0){if(sel2.length>1)sel2.splice(i,1)}else{if(sel2.length>=2)sel2.shift();sel2.push(r)}draw()}});
    $("rC").onclick=closePop;$("rO").onclick=function(){x.role=sel2[0];x.role2=sel2[1]||"";if(x.name){store.roleOf[x.name]=x.role;store.role2Of[x.name]=x.role2}closePop();changed(true)}}
  draw();P.classList.add("on")}
function timePop(x,p){var P=$("pop");
  P.innerHTML='<h4>'+esc(x.name||"この人")+'の勤務時間</h4><div class="r"><select id="tS">'+optsAll(x.s)+'</select><span>〜</span><select id="tE">'+optsAll(x.e)+'</select></div><div class="r"><button id="tC">やめる</button><button class="go" id="tO">決定</button></div>';
  P.classList.add("on");$("tC").onclick=closePop;$("tO").onclick=function(){x.s=+$("tS").value;x.e=Math.max(x.s+15,+$("tE").value);p.edited=true;closePop();changed(true)}}
function changed(rebuild){var p=plan();if(rebuild)p.bars=null;store.wd[parseD($("date").value).getDay()]=p.staff.map(function(x){return{name:x.name,s:x.s,e:x.e,role:x.role,lead:x.lead}});save();render()}
$("undo").onclick=function(){var u=undoSt.pop();if(!u)return;var p=plan(),o=JSON.parse(u);["staff","bars","ov","note","edited","airSig"].forEach(function(k){p[k]=o[k]});lastState=u;save();closePop();render()};
$("reset").onclick=function(){var p=plan();p.bars=null;p.ov={};changed(true)};
$("print").onclick=function(){sel=null;render();window.print()};
function go(ds){undoSt=[];lastState=null;$("date").value=ds;sel=null;closePop();Promise.all([fetchDay(ds),fetchAir(ds)]).then(function(){applyAir();render();fit()})}
$("date").onchange=function(){go(this.value)};
$("prev").onclick=function(){go(addD($("date").value,-1))};
$("next").onclick=function(){go(addD($("date").value,1))};

/* ---- 帯の操作：動かす・伸ばす・タップで編集 ---- */
var LONG_MS=350;
function dragger(el,b,B,rz){
  var tr=el.parentNode,w=tr.getBoundingClientRect().width,per=(T1-T0)/w,os=b.s,oe=b.e,x0=null,lastX=0,lastY=0,moved=false;
  return{start:function(x,y){x0=x;lastX=x;lastY=y;el.classList.add("lift")},
   move:function(x,y){lastX=x;lastY=y;var d=Math.round((x-x0)*per/5)*5;if(!d&&!moved&&Math.abs(y)<0)return;if(d)moved=true;
     if(rz){b.e=Math.max(b.s+5,Math.min(T1,oe+d))}else{var len=oe-os,st=Math.max(T0,Math.min(T1-len,os+d));b.s=st;b.e=st+len}
     el.style.left=X(b.s)+"%";el.style.width=(X(b.e)-X(b.s))+"%";
     if(!rz){el.style.visibility="hidden";var u=document.elementFromPoint(x,y);el.style.visibility="";var t=u&&u.closest&&u.closest(".gtrack[data-p]");if(t&&+t.dataset.p!==b.p){b.p=+t.dataset.p;moved=true;t.appendChild(el)}}},
   end:function(){el.classList.remove("lift");if(!moved)return false;var p=plan();B.splice(B.indexOf(b),1);placeBar(B,b);p.bars=B;save();render();return true}}}
function bindBars(B){
  document.querySelectorAll("#sheet .bar").forEach(function(el){
    var b=B[+el.dataset.i];
    el.onmousedown=function(ev){ev.preventDefault();var d=dragger(el,b,B,ev.target.classList.contains("rz"));d.start(ev.clientX,ev.clientY);
      function mv(e){d.move(e.clientX,e.clientY)}
      function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);if(!d.end())openPop(b,B)}
      document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)};
    var d=null,tm=null,sx=0,sy=0,off=false;
    el.addEventListener("touchstart",function(e){if(e.touches.length>1){off=true;clearTimeout(tm);return}var t=e.touches[0];sx=t.clientX;sy=t.clientY;off=false;d=null;var rz=e.target.classList.contains("rz");
      tm=setTimeout(function(){d=dragger(el,b,B,rz);d.start(sx,sy);if(navigator.vibrate)navigator.vibrate(15)},LONG_MS)},{passive:true});
    el.addEventListener("touchmove",function(e){var t=e.touches[0];
      if(!d){if(Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy)>8){off=true;clearTimeout(tm)}return}
      e.preventDefault();d.move(t.clientX,t.clientY)},{passive:false});
    el.addEventListener("touchend",function(e){clearTimeout(tm);if(d){e.preventDefault();d.end();d=null;return}if(!off){e.preventDefault();openPop(b,B)}});
    el.addEventListener("touchcancel",function(){clearTimeout(tm);if(d){el.classList.remove("lift");d=null;render()}});
  })}
function bindTracks(B){document.querySelectorAll("#sheet .gtrack[data-p]").forEach(function(tr){tr.onclick=function(ev){if(ev.target.closest(".bar"))return;
    var r=tr.getBoundingClientRect(),t=T0+Math.round(((ev.clientX-r.left)/r.width*(T1-T0))/15)*15;t=Math.max(T0,Math.min(T1-30,t));
    openPop({p:+tr.dataset.p,s:t,e:Math.min(T1,t+60),k:"free"},B,true)}})}
function closePop(){$("pop").classList.remove("on")}
function openPop(b,B,isNew){var p=plan();
  var kinds=Object.keys(KIND).map(function(k){return'<option value="'+k+'"'+(k===b.k?' selected':'')+'>'+KIND[k].t+'</option>'}).join('')+(b.k&&!KIND[b.k]?'<option value="'+b.k+'" selected>'+kindInfo(b.k).t+'</option>':'');
  var who=p.staff.map(function(x,i){return'<option value="'+i+'"'+(i===b.p?' selected':'')+'>'+(x.name||("担当"+(i+1)))+'</option>'}).join('');
  var P=$("pop");P.innerHTML='<h4>'+(isNew?'帯を足す':'この帯を直す')+'</h4><div class="r"><select id="pK">'+kinds+'</select><input id="pT" placeholder="表示する言葉（任意）" value="'+esc(b.t||"")+'"></div><div class="r"><select id="pS">'+optsAll(b.s)+'</select><span>〜</span><select id="pE">'+optsAll(b.e)+'</select><select id="pP">'+who+'</select></div><div class="r">'+(isNew?'':'<button class="x" id="pD">消す</button>')+'<button id="pC">やめる</button><button class="go" id="pO">決定</button></div>';
  P.classList.add("on");
  $("pC").onclick=closePop;
  if(!isNew)$("pD").onclick=function(){B.splice(B.indexOf(b),1);p.bars=B;save();closePop();render()};
  $("pO").onclick=function(){b.k=$("pK").value;b.t=$("pT").value.trim()||undefined;b.s=+$("pS").value;b.e=Math.max(b.s+5,+$("pE").value);b.p=+$("pP").value;if(!isNew)B.splice(B.indexOf(b),1);placeBar(B,b);p.bars=B;save();closePop();render()}}
function optsAll(v){var s='';for(var t=T0;t<=T1;t+=5)s+='<option value="'+t+'"'+(t===v?' selected':'')+'>'+hm(t)+'</option>';return s}

/* ---- 右の作業一覧から表へ引き込む ---- */
var PAL=["kiji","yaki","mise","sai","reji","shik","zai","kata","open","ykat","kyu","free"],curB=[];
$("pal").innerHTML=PAL.map(function(k){return'<div class="pw '+KIND[k].c+'" data-k="'+k+'">'+KIND[k].t+'</div>'}).join('');
function placeBar(B,b){ // 重なる帯は新しい帯に場所を譲る
  for(var i=B.length-1;i>=0;i--){var o=B[i];if(o.p!==b.p||o.e<=b.s||o.s>=b.e)continue;
    if(o.s>=b.s&&o.e<=b.e)B.splice(i,1);
    else if(o.s<b.s&&o.e>b.e){B.push({p:o.p,s:b.e,e:o.e,k:o.k,t:o.t});o.e=b.s}
    else if(o.s<b.s)o.e=b.s;else o.s=b.e}
  B.push(b)}
document.querySelectorAll(".pw").forEach(function(el){el.onpointerdown=function(ev){ev.preventDefault();
  var k=el.dataset.k,len=k==="kyu"?45:k==="open"?15:60,g=el.cloneNode(true),pv=null,hit=null;g.classList.add("ghost");document.body.appendChild(g);
  function clear(){if(pv){pv.remove();pv=null}}
  function mv(e){g.style.left=(e.clientX-60)+"px";g.style.top=(e.clientY-18)+"px";clear();hit=null;
    var u=document.elementFromPoint(e.clientX,e.clientY),t=u&&u.closest&&u.closest(".gtrack[data-p]");if(!t)return;
    var r=t.getBoundingClientRect(),m=T0+(e.clientX-r.left)/r.width*(T1-T0)-len/2;m=Math.max(T0,Math.min(T1-len,Math.round(m/5)*5));
    hit={p:+t.dataset.p,s:m,e:m+len,k:k};pv=document.createElement("div");pv.className="dropbar";pv.style.left=X(m)+"%";pv.style.width=(X(m+len)-X(m))+"%";t.appendChild(pv)}
  function up(){document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);g.remove();clear();
    if(hit){var p=plan();placeBar(curB,hit);p.bars=curB;save();render()}}
  mv(ev);document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up)}});
